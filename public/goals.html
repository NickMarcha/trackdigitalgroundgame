<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Election Fundraiser goals</title>
    <link rel="stylesheet" href="style.css">
    <link rel="modulepreload" href="goals.js">
  </head>
  <body>
    <main>
      <header>
        <img src="logo.svg" alt="Digital Ground Game" class="logo">
        <h1>Election <em>Fundraiser</em></h1>
      </header>
      <p class="error-note">Could not load the total. Try again in a minute.</p>
      <div class="layout">
        <ol class="rail" id="rail"></ol>
        <section class="summary">
          <strong id="raised"></strong>
          <p class="label">raised so far</p>
          <div class="bar"><div class="fill" id="fill"></div></div>
          <p class="next" id="next"></p>
          <p class="updated" id="updated"></p>
          <div class="actions">
            <button type="button" data-donate>Donate on ActBlue</button>
          </div>
        </section>
      </div>
    </main>
    <script src="goals.js" type="module"></script>
  </body>
</html>
